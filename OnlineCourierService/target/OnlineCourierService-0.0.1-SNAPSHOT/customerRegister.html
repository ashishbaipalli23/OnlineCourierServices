<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Customer Registration</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body {
      background-color: #f2f2f2;
    }
    .navbar-brand {
      font-weight: bold;
      font-size: large;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
  <div class="container">
    <a class="navbar-brand text-light" href="#">Online Courier Services</a>
  </div>
</nav>

<!-- Registration Form -->
<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
  <div class=" mt-5 mb-5  col-md-6 col-lg-5 bg-white p-5 rounded shadow">

    <h3 class="text-center mb-4">Customer Registration</h3>
    
    <form action="customerRegistration" method="post">
      
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name" name="name" required />
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="number" class="form-control" id="phone" name="phone" required />
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" />
      </div>

      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <textarea class="form-control" id="address" name="address" rows="3"></textarea>
      </div>

      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" required />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" required />
      </div>

      <div class="d-grid">
        <div class="row">
          <div class="col">
            <a href="index.html" class="btn btn-warning form-control">Go Back</a>
          </div>
          <div class="col">
            <button type="submit" class="btn btn-primary form-control">
              <i class="bi bi-person-plus-fill me-1"></i> Register
            </button>
          </div>
        </div>
      </div>

      <div class="mt-3 text-center">
        <p>Already have an account? <a href="login.jsp">Login</a></p>
      </div>

    </form>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
